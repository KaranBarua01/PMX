name: Windows alpha build

env:
  PMX_VERSION: 0.2.0-alpha.${{ github.run_number }}

on:
  push:
    branches: [main, "feat/**", "codex/**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Route Eigen dependency through GitHub mirror
        shell: pwsh
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen.git".insteadOf "https://gitlab.com/libeigen/eigen"

      - name: Configure
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            cmake -S . -B build -A x64 -DPMX_BUILD_GUI=ON -DPMX_BUILD_TESTS=ON -DPMX_ENABLE_NAM_CORE=ON -DPMX_VERSION_STRING="$env:PMX_VERSION"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $attempts) { exit $LASTEXITCODE }
            Write-Host "Configure attempt $attempt failed; retrying after transient dependency error..."
            Remove-Item -Recurse -Force build/_deps/namcore-* -ErrorAction SilentlyContinue
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify user data is outside the install directory
        shell: pwsh
        run: |
          $script = Get-Content installer/PMX.iss -Raw
          if ($script -notmatch 'DefaultDirName=\{localappdata\}\\Programs\\PMX') { throw 'Installer is not per-user under LocalAppData Programs.' }
          if ($script -match '\{localappdata\}\\PMX.*delete') { throw 'Installer script appears to delete PMX user data.' }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Bundle corresponding source and build identity
        shell: pwsh
        run: ./scripts/bundle-source.ps1

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:PMX_VERSION" installer\PMX.iss'

      - name: Test install, native startup and data preservation
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Write download checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/PMX-*.exe,dist/PMX-source.zip | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: PMX-windows-alpha-unsigned
          path: |
            build/PMX_artefacts/Release/PMX.exe
            dist/PMX-*-x64.exe
            dist/PMX-source.zip
            dist/BUILD-INFO.txt
            dist/SHA256SUMS.txt
            LICENSE
            NOTICE.txt
            SOURCE.md
            build/distribution/licenses/**
            docs/testing/first-pocket-master-test.md
          if-no-files-found: error

      - name: Upload UI verification renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PMX-native-ui-renders
          path: build/ui-renders/*.png
          if-no-files-found: ignore

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/pmx-stage1'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PMX-windows-alpha-unsigned
          path: package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PMX_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: PMX v${{ env.PMX_VERSION }} — development preview
          body: |
            Automatic PMX development preview from the latest validated codex/pmx-stage1 build.
            This release exists so installed PMX alpha builds can update directly from the in-app Update button.
            Native Windows x64 test alpha. This build is unsigned.
            Download the x64 installer. PMX-source.zip contains the matching source and dependencies under AGPLv3.
            BUILD-INFO.txt identifies the commit; SHA256SUMS.txt contains download checksums.
            Automated checks cover core logic, native rendering, model/IR processing, installer startup and user-data preservation.
            Pocket Master routing, sound quality, latency and disconnect behaviour still require the hardware checklist.
            Guitar only at this stage. Bass, Synth, guitar-triggered Drums, Piano and Violin follow hardware acceptance.
          files: |
            package/dist/PMX-*-x64.exe
            package/dist/PMX-source.zip
            package/dist/BUILD-INFO.txt
            package/dist/SHA256SUMS.txt
            package/build/PMX_artefacts/Release/PMX.exe
            package/docs/testing/first-pocket-master-test.md
