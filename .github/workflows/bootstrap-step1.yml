name: Bootstrap PMX Step 1

on:
  push:
    branches:
      - feat/pmx-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pmx-foundation
          fetch-depth: 0

      - name: Reconstruct and verify PMX source patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/step1-00.b64 ci/step1-01.b64 ci/step1-02.b64 ci/step1-03.b64 ci/step1-04.b64 ci/step1-05.b64 > /tmp/pmx-step1.patch.gz.b64
          base64 --decode /tmp/pmx-step1.patch.gz.b64 > /tmp/pmx-step1.patch.gz
          gzip -dc /tmp/pmx-step1.patch.gz > /tmp/pmx-step1.patch
          echo "9502195b427bbf04a4cce445b5f0114fda7af21a2c0fafe8f56e32a50e9edc45  /tmp/pmx-step1.patch" | sha256sum --check -
          git apply --check /tmp/pmx-step1.patch
          git apply /tmp/pmx-step1.patch

      - name: Replace transfer scaffolding with real source
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/step1-*.b64 ci/pmx-patch-b64-00
          rm -f .github/workflows/bootstrap-step1.yml
          rmdir ci 2>/dev/null || true
          git add -A
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish PMX Step 1 source"
          git push origin HEAD:feat/pmx-foundation
